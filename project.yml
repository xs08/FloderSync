name: obsSync
options:
  xcodeVersion: "26.6"
  bundleIdPrefix: dev.obssync
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  obsSync:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.obssync.app
        PRODUCT_NAME: FloderSync
        PRODUCT_MODULE_NAME: obsSync
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: FloderSync
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
  obsSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: obsSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.obssync.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FloderSync.app/Contents/MacOS/FloderSync"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  obsSync:
    build:
      targets:
        obsSync: all
        obsSyncTests: [test]
    test:
      targets:
        - obsSyncTests
