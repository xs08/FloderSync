name: obsSync
options:
  bundleIdPrefix: dev.obssync
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
targets:
  obsSync:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.obssync.app
        PRODUCT_NAME: obsSync
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: obsSync
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
  obsSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: obsSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.obssync.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  obsSync:
    build:
      targets:
        obsSync: all
        obsSyncTests: [test]
    test:
      targets:
        - obsSyncTests
